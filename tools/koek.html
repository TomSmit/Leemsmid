<!-- koek: toestemming voor de Google-tag. Bron: tools/koek.html, wordt door tools/bouw.py in elke pagina gezet. -->
<style>
.koek{position:fixed;z-index:60;right:var(--gutter);bottom:calc(16px + env(safe-area-inset-bottom,0px));left:var(--gutter);max-width:540px;margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:16px 18px;background:#141210;border:1px solid var(--rule);font-family:var(--mono);font-weight:300;font-size:11.5px;line-height:1.6;letter-spacing:.02em;color:var(--ink-soft)}
.koek[hidden]{display:none}
.koek p{margin:0;flex:1 1 240px}
.koek a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.koek button{font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:none;color:var(--ink-soft);border:1px solid var(--rule);padding:9px 14px;cursor:pointer}
.koek button.ja{color:var(--ink);border-color:var(--earth)}
.koek button:hover{color:var(--ink)}
a[href^="mailto:"],a[href^="tel:"]{text-decoration:none;transition:color .3s}
a[href^="mailto:"]:hover,a[href^="tel:"]:hover{color:var(--earth)}
</style>
<script>
(function(){
  var ID='AW-18505375780';
  var CONV=''; // label van de conversieactie uit Google Ads, bijvoorbeeld 'AW-18505375780/AbC-dEfG'
  var KEY='ls-cookies', geladen=false;
  function lees(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function bewaar(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function laad(){
    if(geladen)return; geladen=true;
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){dataLayer.push(arguments)};
    gtag('consent','default',{ad_storage:'granted',ad_user_data:'granted',ad_personalization:'denied',analytics_storage:'denied'});
    gtag('js',new Date());
    gtag('config',ID);
    var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;document.head.appendChild(s);
  }
  function wis(){
    document.cookie.split(';').forEach(function(c){var n=c.split('=')[0].trim();
      if(/^_gcl|^_ga|^_gac/.test(n)){['',';domain=.leemsmid.nl',';domain=leemsmid.nl'].forEach(function(d){document.cookie=n+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'+d})}});
  }
  function toon(){
    var b=document.getElementById('koek');
    if(b){b.hidden=false;return}
    b=document.createElement('div');b.id='koek';b.className='koek';
    b.setAttribute('role','region');b.setAttribute('aria-label','Cookies');
    b.innerHTML='<p>Google meet graag of bezoekers via een advertentie binnenkomen. Daarvoor zijn cookies nodig. <a href="/privacy/">Privacy</a></p>'+
      '<button type="button" class="nee">Liever niet</button><button type="button" class="ja">Akkoord</button>';
    document.body.appendChild(b);
    b.addEventListener('click',function(e){
      var t=e.target;if(t.tagName!=='BUTTON')return;
      var ja=t.className==='ja';bewaar(ja?'ja':'nee');b.hidden=true;
      if(ja)laad();else{wis();if(geladen)location.reload()}
    });
  }
  window.lsKoek=toon;
  var k=lees();
  if(k==='ja')laad();else if(k!=='nee')toon();
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="mailto:"],a[href^="tel:"]');
    if(a&&geladen&&CONV)gtag('event','conversion',{send_to:CONV});
  });
})();
</script>
<!-- /koek -->
