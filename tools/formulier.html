<!-- formulier: bron tools/formulier.html, wordt door tools/bouw.py ingevoegd zodra FORM_URL in bouw.py is ingevuld -->
<style>
.aform{margin-top:28px;display:grid;gap:16px;position:relative}
.aform .rij{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.aform .rij{grid-template-columns:minmax(0,1fr)}}
.aform label{display:grid;gap:4px;font-family:var(--mono);font-weight:300;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.aform input,.aform select,.aform textarea{font-family:var(--serif);font-size:17px;letter-spacing:normal;text-transform:none;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:8px 0;width:100%}
.aform select{appearance:none;cursor:pointer}
.aform option{color:#141210;background:#fff}
.aform textarea{min-height:96px;resize:vertical;line-height:1.5}
.aform input:focus,.aform select:focus,.aform textarea:focus{outline:none;border-bottom-color:var(--earth)}
.aform .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.aform button{justify-self:start;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:none;color:var(--ink);border:1px solid var(--earth);padding:12px 18px;cursor:pointer}
.aform button:disabled{opacity:.5;cursor:default}
.aform .klein{font-size:14px;color:var(--ink-faint);margin:0}
.aform .status{font-size:17px;color:var(--ink-soft);margin:0}
</style>
<form class="aform" action="FORM_URL" method="POST">
  <p class="klein">Nog geen plannen, wel nieuwsgierig? Stel je vraag, ik denk graag mee.</p>
  <div class="rij"><label>Naam<input name="naam" required autocomplete="name"></label><label>E-mail<input type="email" name="email" required autocomplete="email"></label></div>
  <div class="rij"><label>Telefoon (optioneel)<input type="tel" name="telefoon" autocomplete="tel"></label><label>Plaats<input name="plaats" autocomplete="address-level2"></label></div>
  <label>Waar gaat het om<select name="onderwerp"><option>Glanspleister</option><option>Leemfinish</option><option>Weet ik nog niet</option><option>Gewoon een vraag</option></select></label>
  <label>Je vraag<textarea name="bericht" required></textarea></label>
  <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="_subject" value="Aanvraag via leemsmid.nl">
  <input type="hidden" name="pagina" value="">
  <p class="klein">Een foto van de wand helpt. Die kun je na je bericht sturen naar info@leemsmid.nl of via <a href="https://wa.me/31651947969?text=Hallo%20Tom%2C%20ik%20heb%20een%20vraag%20over%20leem." target="_blank" rel="noopener">WhatsApp</a>.</p>
  <button type="submit">Versturen</button>
  <p class="status" role="status" style="display:none"></p>
</form>
<script>
(function(){
  document.querySelectorAll('.aform').forEach(function(f){
    f.elements.pagina.value = location.pathname;
    f.addEventListener('submit', function(e){
      e.preventDefault();
      var b = f.querySelector('button'), s = f.querySelector('.status');
      b.disabled = true; s.style.display = 'none';
      fetch(f.action, {method:'POST', body:new FormData(f), headers:{Accept:'application/json'}}).then(function(r){
        if(!r.ok) throw new Error('fout');
        Array.prototype.forEach.call(f.children, function(c){ if(c !== s) c.style.display = 'none'; });
        s.textContent = 'Dank je wel. Ik neem zo snel mogelijk contact op.'; s.style.display = '';
        if(window.gtag) gtag('event','conversion',{send_to:'AW-18505375780/mUjJCNGBoZgdEKTAhvhE'});
      }).catch(function(){
        s.textContent = 'Versturen lukte niet. Mail of bel me gerust direct.'; s.style.display = ''; b.disabled = false;
      });
    });
  });
})();
</script>
<!-- /formulier -->
